plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.quasar.tvparser"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.quasar.tvparser"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Package native libs only for the ABIs Flutter built. libvlc ships x86 and
        // x86_64 too (~60 MB) with no engine to run them. Must replace, not add to,
        // the list the Flutter plugin put here; a build type filter only adds.
        def flutterAbis = [
            'android-arm': 'armeabi-v7a',
            'android-arm64': 'arm64-v8a',
            'android-x64': 'x86_64',
            'android-x86': 'x86',
        ]
        def targetPlatform = project.findProperty('target-platform')
        def builtAbis = targetPlatform
            ? targetPlatform.toString().split(',').collect { flutterAbis[it] }.findAll { it }
            : []
        if (builtAbis) {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(builtAbis)
            }
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // SYMBOL_TABLE: AGP strips .so debug info into BUNDLE-METADATA (*.so.sym).
            // Flutter 3.44 refuses AABs without libflutter.so.sym + libapp.so.sym.
            // 'none' + keepDebugSymbols caused: "failed to strip debug symbols".
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

flutter {
    source = "../.."
}
