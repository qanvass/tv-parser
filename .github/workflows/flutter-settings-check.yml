name: Android TV settings verification

on:
  pull_request:
    branches: [master]
    paths:
      - 'lib/presentation/screens/**'
      - 'lib/presentation/tv/tv_dashboard_shell.dart'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-settings-check.yml'
  workflow_dispatch:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis (errors are fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Focused navigation and preview regression tests
        run: flutter test test/tv_back_navigation_test.dart test/live_hero_preview_controller_test.dart
      - name: Add Maven Central fallback for Flutter's embedded Gradle build
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-central.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
              project.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          GRADLE
      - name: Compile unsigned debug APK
        run: flutter build apk --debug
      - name: Upload Android TV test APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-parser-settings-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
