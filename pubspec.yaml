name: mbark_iptv
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.3+3001

environment:
  sdk: ">=3.10.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  responsive_sizer: ^3.3.1
  awesome_snackbar_content: ^0.1.8
  google_fonts: ^6.3.3
  flutter_rating_bar: ^4.0.1
  readmore: ^3.0.0
  filling_slider: ^0.0.3
  loading_animation_widget: ^1.3.0
  # wakelock: ^0.6.2

  #Logic
  geolocator: ^13.0.0
  permission_handler: ^11.3.1
  flutter_bloc: ^9.1.1
  get: ^4.7.3
  intl: ^0.20.2
  get_storage: ^2.1.1
  cast: ^2.1.0
  # wakelock: ^0.6.2
  #perfect_volume_control: ^1.0.5
  volume_controller: ^3.4.1
  screen_brightness: ^2.1.7

  #M3U
  #flutter_vlc_player: ^7.4.4
  flutter_vlc_player_16kb: ^7.4.7
  pod_player: ^0.2.2
  video_player: ^2.10.1

  # Native TV text input — fixes Flutter engine bug on Chromecast where
  # arrow keys are intercepted before reaching the IME.
  # Vendored locally so the compileSdk fix (33→35) is permanent.
  android_tv_text_field:
    path: packages/android_tv_text_field

  #Http
  dio: ^5.9.0
  #google_mobile_ads: ^6.0.0

dependency_overrides:
  win32: any
  bonsoir: 5.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.4.0"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/desktop_shortcut_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/desktop_shortcut_icon_foreground.png"

flutter_native_splash:
  # Solid black native chrome only — Flutter splash video owns branding.
  # Do not set `image` / android_12.image or regenerating will restore the boxed logo flash.
  color: "#000000"
  android_12:
    color: "#000000"
